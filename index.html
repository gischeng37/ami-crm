<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMI CRM — 美國品牌開發</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1c2530; --muted:#667085; --line:#dfe4ea;
  --accent:#0b6fa4; --accent-ink:#fff; --danger:#b42318; --ok:#067647;
  --chip:#eef4f8; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;white-space:nowrap}
.topbar .spacer{flex:1}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;min-height:1.2em}
.ok{color:var(--ok);font-size:13px}
.hidden{display:none!important}
/* login */
.login{max-width:420px;margin:48px auto}
.login label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.login h2{margin:0 0 4px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--chip);border-radius:8px;padding:10px 12px}
.stat b{font-size:22px;display:block}
.stat span{font-size:13px;color:var(--muted)}
/* filters */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.filters label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
/* list */
.row{display:grid;grid-template-columns:2.2fr 1fr .8fr 1fr 1.2fr;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f7fafc}
.row.head{font-size:12px;color:var(--muted);cursor:default;background:none;font-weight:700}
/* 欄位名稱列：瀏覽時懸浮固定在頂欄下方 */
.row.head{position:sticky;top:var(--stickyTop,56px);z-index:10;background:var(--card);border-bottom:2px solid var(--line);box-shadow:0 1px 0 var(--line)}
.imp{display:grid;grid-template-columns:2fr 1.4fr .8fr 1.2fr;gap:6px;padding:8px;border-top:1px solid var(--line);align-items:center}
.imp.head{font-size:12px;color:var(--muted);font-weight:700;border-top:0}
/* 翻頁列 */
.pager{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:14px 8px 6px}
.pager .pg{min-width:34px;padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:8px}
.pager .pg.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.pager .pg:disabled{opacity:.5;cursor:not-allowed}
.pager .dots{color:var(--muted);padding:0 2px}
.pager .info{margin-left:auto;color:var(--muted);font-size:13px}
.row .nm{font-weight:700}
.row .dm{color:var(--muted);font-size:13px;word-break:break-all}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
.tag.a{background:#fdecec;color:#b42318;font-weight:700}
.tag.b{background:#eef4f8;color:#0b6fa4;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* detail overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;justify-content:flex-end}
.panel{background:#fff;width:min(680px,100%);height:100%;overflow-y:auto;padding:18px}
.panel h2{margin:0 0 2px;word-break:break-all}
.panel h3{margin:18px 0 8px;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.kv dd a{word-break:break-all}
.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.editgrid .full{grid-column:1/-1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.subitem{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;font-size:14px}
.subitem .meta{color:var(--muted);font-size:12px}
/* 主畫面分頁（品牌主檔／名單池） */
.viewtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.viewtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:700}
.viewtabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 名單池 */
.lfilters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.lfilters label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.lrow{display:grid;grid-template-columns:2fr 1.1fr .8fr .8fr .5fr .9fr 1.7fr;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:hover{background:#f7fafc}
.lrow.head{font-size:12px;color:var(--muted);cursor:default;background:none;font-weight:700}
/* 名單池欄位名稱列：同品牌主檔，瀏覽時懸浮固定 */
.lrow.head{position:sticky;top:var(--stickyTop,56px);z-index:10;background:var(--card);border-bottom:2px solid var(--line);box-shadow:0 1px 0 var(--line)}
.lrow .nm{font-weight:700}
.lrow .dm{color:var(--muted);font-size:13px;word-break:break-all}
.lrow .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.lrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.tag.green{background:#e6f4ea;color:#067647;font-weight:700}
.tag.grey{background:#eceef0;color:#667085;font-weight:700}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.formrow .full{grid-column:1/-1}
@media (max-width:768px){
  .filters{grid-template-columns:1fr 1fr}
  .filters .full-m{grid-column:1/-1}
  .row{grid-template-columns:1fr 1fr;row-gap:4px}
  .row.head{display:none}
  .lfilters{grid-template-columns:1fr 1fr}
  .lfilters .full-m{grid-column:1/-1}
  .lrow{grid-template-columns:1fr 1fr;row-gap:4px}
  .lrow.head{display:none}
  .lrow .acts{grid-column:1/-1}
  .lrow [data-l]::before{content:attr(data-l) "：";color:var(--muted);font-size:12px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .editgrid,.formrow{grid-template-columns:1fr}
  body{font-size:14px}
}
@media (max-width:480px){
  .wrap{padding:10px}
  .topbar h1{font-size:16px}
  .filters{grid-template-columns:1fr}
  .lfilters{grid-template-columns:1fr}
  .panel{padding:14px}
  .stat b{font-size:19px}
}
</style>
</head>
<body>
<header class="topbar">
  <h1 data-i18n="appTitle">AMI CRM — 美國品牌開發</h1>
  <div class="spacer"></div>
  <span id="whoami" class="muted"></span>
  <button id="langBtn" class="btn ghost small" type="button">EN</button>
  <button id="logoutBtn" class="btn ghost small hidden" type="button" data-i18n="logout">登出</button>
</header>
<main class="wrap">

  <!-- 登入 -->
  <section id="loginView" class="card login">
    <h2 data-i18n="loginTitle">登入 CRM</h2>
    <p class="muted" data-i18n="loginHint">使用 Supabase 帳號登入（與主系統 ami-platform 共用帳號）。</p>
    <label for="email" data-i18n="email">電子郵件</label>
    <input id="email" type="email" autocomplete="username" placeholder="jack@albertmax.com">
    <label for="password" data-i18n="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <div style="height:12px"></div>
    <button id="loginBtn" class="btn" type="button" style="width:100%" data-i18n="login">登入</button>
    <p id="loginErr" class="err"></p>
    <p style="text-align:center;margin:6px 0 0"><a href="#" id="forgotLink" data-i18n="forgotPw">忘記密碼？</a></p>
    <p id="forgotMsg" class="ok" style="text-align:center"></p>
    <p class="muted" data-i18n="loginNote">帳號由管理員在 Supabase Authentication 建立；登入失敗請確認帳號與密碼。</p>
  </section>

  <!-- 重設密碼（由重設信連結進入） -->
  <section id="resetView" class="card login hidden">
    <h2 data-i18n="resetTitle">設定新密碼</h2>
    <p class="muted" data-i18n="resetHint">請設定一組新密碼，之後用這組密碼登入 CRM。</p>
    <label for="newPw" data-i18n="newPassword">新密碼</label>
    <input id="newPw" type="password" autocomplete="new-password" placeholder="••••••••">
    <label for="newPw2" data-i18n="confirmPassword">確認新密碼</label>
    <input id="newPw2" type="password" autocomplete="new-password" placeholder="••••••••">
    <div style="height:12px"></div>
    <button id="setPwBtn" class="btn" type="button" style="width:100%" data-i18n="setPassword">設定新密碼</button>
    <p id="resetErr" class="err"></p>
    <p id="resetOk" class="ok"></p>
  </section>

  <!-- 主畫面 -->
  <section id="mainView" class="hidden">
    <div class="viewtabs">
      <button id="viewCompaniesBtn" type="button" class="on" data-i18n="tabCompanies">品牌主檔</button>
      <button id="viewLeadsBtn" type="button" data-i18n="tabLeads">名單池</button>
    </div>
    <div id="companiesView">
    <div class="card">
      <div class="stats" id="stats"></div>
    </div>
    <div class="card">
      <div class="filters">
        <div class="full-m"><label data-i18n="search">搜尋</label><input id="q" type="search" data-i18n-ph="searchPh" placeholder="品牌名稱或網域…"></div>
        <div><label data-i18n="priority">優先級</label><select id="fPriority"><option value="" data-i18n="all">全部</option><option>A</option><option>B</option><option>C</option></select></div>
        <div><label data-i18n="stage">階段</label><select id="fStage"><option value="" data-i18n="all">全部</option></select></div>
        <div><label data-i18n="factory">工廠</label><select id="fFactory"><option value="" data-i18n="all">全部</option></select></div>
        <div><label data-i18n="format">劑型</label><select id="fFormat"><option value="" data-i18n="all">全部</option></select></div>
        <div><button id="resetBtn" class="btn ghost" type="button" data-i18n="reset">重設</button></div>
      </div>
    </div>
    <div class="card" style="padding-top:4px">
      <div id="listMeta" class="muted" style="padding:10px 8px 0"></div>
      <div class="row head"><span data-i18n="colBrand">品牌</span><span data-i18n="colPriority">優先級</span><span data-i18n="colStage">階段</span><span data-i18n="colFactory">工廠</span><span data-i18n="colContact">聯絡</span></div>
      <div id="list"></div>
      <div id="pager" class="pager"></div>
      <div id="listEmpty" class="empty hidden" data-i18n="noResult">沒有符合的品牌。</div>
    </div>
    </div>
    <!-- 名單池 -->
    <div id="leadsView" class="hidden">
      <div class="card">
        <div class="stats" id="leadsStats"></div>
      </div>
      <div class="card">
        <div class="lfilters">
          <div class="full-m"><label data-i18n="search">搜尋</label><input id="lq" type="search" data-i18n-ph="leadSearchPh" placeholder="品牌名稱…"></div>
          <div><label data-i18n="leadBand">營收級距</label><select id="fBand"><option value="" data-i18n="all">全部</option><option value="A1">A1</option><option value="A2">A2</option></select></div>
          <div><label data-i18n="leadTier">級別</label><select id="fTier"><option value="" data-i18n="all">全部</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
          <div><label data-i18n="leadStatus">狀態</label><select id="fStatus"><option value="" data-i18n="all">全部</option><option value="new" data-i18n="leadStNew">新名單</option><option value="qualified" data-i18n="leadStQualified">已篩選</option><option value="promoted" data-i18n="leadStPromoted">已晉升</option><option value="rejected" data-i18n="leadStRejected">已拒絕</option></select></div>
          <div><button id="lResetBtn" class="btn ghost" type="button" data-i18n="reset">重設</button></div>
        </div>
      </div>
      <div class="card">
        <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
          <b data-i18n="importTitle">匯入名單</b>
          <button id="importToggleBtn" class="btn ghost small" type="button" data-i18n="importToggle">貼上文字匯入</button>
        </div>
        <div id="importPanel" class="hidden" style="margin-top:10px">
          <label class="muted" data-i18n="importHint">每行一家，格式：品牌名稱（可加網域，例如：NOHO Drink nohodrink.com）。貼上後先解析、比對，確認再匯入。</label>
          <textarea id="importText" rows="6" style="margin-top:6px" data-i18n-ph="importTextPh" placeholder="NOHO Drink nohodrink.com&#10;Sly&#10;REVYVE"></textarea>
          <div class="editgrid" style="margin-top:8px">
            <div class="full"><label class="muted" data-i18n="importSource">資料來源</label><input id="importSource" type="text" data-i18n-ph="importSourcePh" placeholder="例如 apollo-more-labs-similar-2026-11-15"></div>
          </div>
          <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <button id="importParseBtn" class="btn small" type="button" data-i18n="importParse">解析比對</button>
            <button id="importBtn" class="btn small hidden" type="button" data-i18n="importDo">匯入新增</button>
            <span id="importMsg" class="err"></span>
          </div>
          <div id="importPreview" style="margin-top:10px"></div>
        </div>
      </div>
      <div class="card" style="padding-top:4px">
        <div id="leadsMeta" class="muted" style="padding:10px 8px 0"></div>
        <div class="lrow head"><span data-i18n="colBrand">品牌</span><span data-i18n="colRevenue">月營收</span><span data-i18n="colSales">月銷量</span><span data-i18n="colBand">級距</span><span data-i18n="colTier">級別</span><span data-i18n="colStatus">狀態</span><span data-i18n="colActions">操作</span></div>
        <div id="leadsList"></div>
        <div id="leadPager" class="pager"></div>
        <div id="leadsEmpty" class="empty hidden" data-i18n="leadNoResult">沒有符合的名單。</div>
      </div>
      <p id="leadsMsg" class="err"></p>
    </div>
  </section>
  <p id="msg" class="err"></p>
</main>

<!-- 明細 -->
<div id="overlay" class="overlay hidden">
  <div class="panel" role="dialog" aria-modal="true">
    <div style="display:flex;gap:8px;justify-content:space-between;align-items:start">
      <div><h2 id="dName"></h2><div id="dDomain" class="muted"></div></div>
      <button id="closeBtn" class="btn ghost small" type="button">✕</button>
    </div>
    <div id="dTags" style="margin:10px 0"></div>
    <h3 data-i18n="followup">跟進</h3>

      <div><label class="muted" data-i18n="owner">負責人</label><input id="eOwner" type="text"></div>

      <div class="full"><label class="muted" data-i18n="nextAction">下一步行動</label><textarea id="eNextAction" rows="2"></textarea></div>
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button id="saveBtn" class="btn" type="button" data-i18n="save">儲存跟進</button>
      <span id="saveMsg" class="ok"></span>
    </div>
    <div class="tabs">
      <button type="button" data-tab="info" class="on" data-i18n="tabInfo">資料</button>
      <button type="button" data-tab="contacts" data-i18n="tabContacts">聯絡人</button>
      <button type="button" data-tab="deals" data-i18n="tabDeals">商機</button>

    </div>
    <div id="tab-info"></div>
    <div id="tab-contacts" class="hidden"></div>
    <div id="tab-deals" class="hidden"></div>
    <div id="tab-activities" class="hidden"></div>
  </div>
</div>

<!-- 名單明細 -->
<div id="leadOverlay" class="overlay hidden">
  <div class="panel" role="dialog" aria-modal="true">
    <div style="display:flex;gap:8px;justify-content:space-between;align-items:start">

      <span id="ldMsg" class="err"></span>
    </div>
  </div>
</div>

/* ---------- API ---------- */
function headers(json) {
  const h = { "apikey": SB_ANON };
  if (session && session.access_token) h["Authorization"] = "Bearer " + session.access_token;
  if (json) h["Content-Type"] = "application/json";
  if (json) h["Prefer"] = "return=representation";
  return h;
}
async function sb(path, opts) {
  const res = await fetch(SB_URL + path, opts || {});
  if (res.status === 401) { signOut(true); throw new Error(t("needLogin")); }
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); if (j.message) msg = j.message; else if (j.error_description) msg = j.error_description; } catch(e) {}
    throw new Error(msg);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

  session = null;
  localStorage.removeItem("crm_session");
  companies = []; current = null;

$("#loginBtn").addEventListener("click", async () => {
  const email = $("#email").value.trim(), password = $("#password").value;
  $("#loginErr").textContent = "";
  $("#loginBtn").disabled = true;
  try {
    const res = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "apikey": SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error_description || j.msg || j.message || res.statusText);
    session = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user };
    localStorage.setItem("crm_session", JSON.stringify(session));
    $("#password").value = "";
    showMain();
    await loadCompanies();
  } catch (e) {
    $("#loginErr").textContent = t("loginFail") + " (" + e.message + ")";
  } finally {
    $("#loginBtn").disabled = false;
  }
});
$("#password").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });

function parseHashParams() {
  const h = location.hash || "";
  if (!h.startsWith("#")) return new URLSearchParams();
  return new URLSearchParams(h.slice(1));
}
async function handleRecoveryHash() {
  const p = parseHashParams();
  if (p.get("type") !== "recovery" || !p.get("access_token")) return false;
  const access = p.get("access_token"), refresh = p.get("refresh_token") || "";
  try {
    const res = await fetch(SB_URL + "/auth/v1/user", {
      headers: { "apikey": SB_ANON, "Authorization": "Bearer " + access }
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error_description || j.msg || j.message || res.statusText);
    session = { access_token: access, refresh_token: refresh, user: j };
    localStorage.setItem("crm_session", JSON.stringify(session));
    history.replaceState(null, "", location.pathname + location.search);
    $("#loginView").classList.add("hidden");
    $("#mainView").classList.add("hidden");
    $("#logoutBtn").classList.add("hidden");
    $("#resetView").classList.remove("hidden");
    return true;
  } catch (e) {
    history.replaceState(null, "", location.pathname + location.search);
    showLogin();
    $("#loginErr").textContent = t("resetExpired") + " (" + e.message + ")";
    return true;
  }
}
$("#setPwBtn").addEventListener("click", async () => {

    });

$("#forgotLink").addEventListener("click", async e => {

  if (!email) { $("#loginErr").textContent = t("forgotNeedEmail"); return; }

    const res = await fetch(SB_URL + "/auth/v1/recover", {

<script>
"use strict";
/* ---------- 清單 ---------- */
function renderFilterOptions() {
  const fill = (sel, values) => {
    const el = $(sel), cur = el.value;
    const keep = el.querySelector("option[value='']");
    el.innerHTML = "";
    el.appendChild(keep);
    values.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = (sel === "#fStage" ? stageLabel(v) : v); el.appendChild(o); });
    el.value = cur;
  };
  const uniq = f => [...new Set(companies.map(c => c[f]).filter(Boolean))].sort();
  fill("#fStage", STAGES.filter(s => companies.some(c => c.stage === s)));
  fill("#fFactory", uniq("factory"));
  fill("#fFormat", uniq("format"));
  const es = $("#eStage");
  if (es && !es.options.length) STAGES.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = stageLabel(s); es.appendChild(o); });
  if (es) [...es.options].forEach(o => { o.textContent = stageLabel(o.value); });
}
function filtered() {
  const q = $("#q").value.trim().toLowerCase();
  const p = $("#fPriority").value, s = $("#fStage").value, fa = $("#fFactory").value, fo = $("#fFormat").value;
  return companies.filter(c =>
    (!q || (c.name || "").toLowerCase().includes(q) || (c.domain || "").toLowerCase().includes(q)) &&
    (!p || c.priority === p) && (!s || c.stage === s) && (!fa || c.factory === fa) && (!fo || c.format === fo));
}
function renderStats() {
  const el = $("#stats");
  if (!companies.length) { el.innerHTML = ""; return; }
  const count = f => companies.filter(c => c[f] === f).length;
  const byPri = ["A","B","C"].map(p => ({ k: p, n: companies.filter(c => c.priority === p).length }));
  const byStage = {};
  companies.forEach(c => { byStage[c.stage || "—"] = (byStage[c.stage || "—"] || 0) + 1; });
  let html = `<div class="stat"><b>${companies.length}</b><span>${esc(t("statTotal"))}</span></div>`;
  byPri.forEach(x => { html += `<div class="stat"><b>${x.n}</b><span>${esc(t("priority"))} ${esc(x.k)}</span></div>`; });
  Object.keys(byStage).sort().forEach(s => { html += `<div class="stat"><b>${byStage[s]}</b><span>${esc(t("statStage").replace("{s}", stageLabel(s)))}</span></div>`; });
  el.innerHTML = html;
}
/* ---------- 品牌主檔翻頁 ---------- */
const PAGE_SIZE = 50;
let listPage = 1;
/* 頂欄高度隨視窗／語言換行而變：量實際高度給懸浮表頭用 */
function syncStickyTop() {
  const bar = document.querySelector(".topbar");
  if (bar) document.documentElement.style.setProperty("--stickyTop", bar.offsetHeight + "px");
}
window.addEventListener("resize", syncStickyTop);
function renderList() {
  const list = filtered();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (listPage > totalPages) listPage = totalPages;
  const start = (listPage - 1) * PAGE_SIZE;
  const page = list.slice(start, start + PAGE_SIZE);
  $("#listMeta").textContent = t("showing").replace("{n}", companies.length).replace("{m}", list.length);
  const box = $("#list");
  box.innerHTML = "";
  $("#listEmpty").classList.toggle("hidden", list.length > 0);
  page.forEach(c => {
    const d = document.createElement("div");
    d.className = "row";
    d.innerHTML =
      `<span><span class="nm">${esc(c.name || t("untitled"))}</span><br><span class="dm">${c.domain ? domainLink(c.domain) : ""}</span></span>` +
      `<span><span class="tag ${c.priority === "A" ? "a" : "b"}">${esc(c.priority || "")}</span></span>` +
      `<span>${esc(stageLabel(c.stage || ""))}</span>` +
      `<span>${esc(c.factory || "")}</span>` +
      `<span class="dm">${esc(c.contact || "")}</span>`;
    d.addEventListener("click", e => { if (e.target.closest("a")) return; openDetail(c); });
    box.appendChild(d);
  });
  renderPager($("#pager"), listPage, totalPages, list.length, start, PAGE_SIZE, p => { listPage = p; renderList(); });
}
/* 翻頁列（品牌主檔與名單池共用）：el 為容器，goTo(p) 切換到第 p 頁 */
function renderPager(el, page, totalPages, total, start, pageSize, goTo) {
  el.innerHTML = "";
  if (!total) return;
  const end = Math.min(total, start + pageSize);
  const prev = document.createElement("button");
  prev.className = "btn ghost small";
  prev.textContent = "‹ " + t("pagePrev");
  prev.disabled = page <= 1;
  prev.addEventListener("click", () => goTo(page - 1));
  el.appendChild(prev);
  /* 頁碼：頁數多時只顯示首頁／尾頁與目前頁前後一頁 */
  let pages = [];
  for (let p = 1; p <= totalPages; p++) pages.push(p);
  if (totalPages > 9) {
    pages = [1, 2, page - 1, page, page + 1, totalPages - 1, totalPages]
      .filter((p, i, a) => p >= 1 && p <= totalPages && a.indexOf(p) === i).sort((a, b) => a - b);
  }
  let last = 0;
  pages.forEach(p => {
    if (p - last > 1) {
      const dots = document.createElement("span");
      dots.className = "dots";
      dots.textContent = "…";
      el.appendChild(dots);
    }
    const b = document.createElement("button");
    b.className = "pg" + (p === page ? " on" : "");
    b.textContent = p;
    b.addEventListener("click", () => goTo(p));
    el.appendChild(b);
    last = p;
  });
  const next = document.createElement("button");
  next.className = "btn ghost small";
  next.textContent = t("pageNext") + " ›";
  next.disabled = page >= totalPages;
  next.addEventListener("click", () => goTo(page + 1));
  el.appendChild(next);
  const info = document.createElement("span");
  info.className = "info";
  info.textContent = t("pageOf").replace("{p}", page).replace("{t}", totalPages) + " · " + t("pageRange").replace("{a}", start + 1).replace("{b}", end);
  el.appendChild(info);
}
async function loadCompanies() {
  $("#msg").textContent = t("loading");
  try {
    companies = await api.companies();
    $("#msg").textContent = "";
    listPage = 1;
    renderFilterOptions(); renderStats(); renderList(); syncStickyTop();
  } catch (e) {
    $("#msg").textContent = t("loadFail") + e.message;
  }
}
["q","fPriority","fStage","fFactory","fFormat"].forEach(id => {
  $("#" + id).addEventListener("input", () => { listPage = 1; renderList(); });
  $("#" + id).addEventListener("change", () => { listPage = 1; renderList(); });
});
$("#resetBtn").addEventListener("click", () => {
  $("#q").value = ""; $("#fPriority").value = ""; $("#fStage").value = ""; $("#fFactory").value = ""; $("#fFormat").value = "";
  listPage = 1;
  renderList();
});

/* ---------- 明細 ---------- */
const domainLink = d => {
  if (!d) return "—";
  const url = /^https?:\/\//i.test(d) ? d : "https://" + d;
  return `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(d)}</a>`;
};
function fieldVal(c, f) {
  const v = c[f];
  if (v == null || v === "") return "—";
  if (f === "domain") return domainLink(v);
  if (isUrl(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
  return esc(v);
}
function renderDetail(c, keepTab) {
  current = c;
  $("#dName").textContent = c.name || t("untitled");
  $("#dDomain").innerHTML = c.domain ? domainLink(c.domain) : "";
  $("#dTags").innerHTML =
    `<span class="tag ${c.priority === "A" ? "a" : "b"}">${esc(c.priority || "")}</span> ` +
    `<span class="tag">${esc(stageLabel(c.stage || ""))}</span> ` +
    `<span class="tag">${esc(c.factory || "")}</span> ` +
    `<span class="tag">${esc(c.format || "")}</span>`;
  $("#eStage").value = c.stage || "研究中";
  $("#eOwner").value = c.owner || "";
  $("#eNextDate").value = c.next_date || "";
  $("#eNextAction").value = c.next_action || "";
  $("#saveMsg").textContent = "";
  let html = "";
  FIELD_GROUPS.forEach(([g, fields]) => {
    html += `<h3>${esc(t(g))}</h3><dl class="kv">`;
    fields.forEach(f => { html += `<dt>${esc(fl(f))}</dt><dd>${fieldVal(c, f)}</dd>`; });
    html += `</dl>`;
  });
  $("#tab-info").innerHTML = html;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ["info","contacts","deals","activities"].forEach(x => $("#tab-" + x).classList.toggle("hidden", x !== tab));
  if (tab !== "info") loadSubtab(tab);
}
function openDetail(c) {
  tab = "info";
  renderDetail(c);
  $("#overlay").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeDetail() {
  $("#overlay").classList.add("hidden");
  document.body.style.overflow = "";
  current = null;
}
$("#closeBtn").addEventListener("click", closeDetail);
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDetail(); closeLeadDetail(); } });
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  if (current) renderDetail(current, true);
}));
$("#saveBtn").addEventListener("click", async () => {
  if (!current) return;
  $("#saveBtn").disabled = true;
  $("#saveMsg").textContent = "";
  const body = {
    stage: $("#eStage").value,
    owner: $("#eOwner").value.trim() || null,
    next_date: $("#eNextDate").value || null,
    next_action: $("#eNextAction").value.trim() || null
  };
  try {
    const updated = await api.patchCompany(current.id, body);
    const row = Array.isArray(updated) ? updated[0] : updated;
    if (row) {
      const i = companies.findIndex(x => x.id === current.id);
      if (i >= 0) companies[i] = row;
      current = row;
    } else {
      Object.assign(current, body);
    }
    $("#saveMsg").textContent = t("saved");
    renderStats(); renderList(); renderDetail(current, true);
  } catch (e) {
    $("#saveMsg").textContent = t("saveFail") + e.message;
    $("#saveMsg").className = "err";
    setTimeout(() => { $("#saveMsg").className = "ok"; }, 4000);
  } finally {
    $("#saveBtn").disabled = false;
  }
});
</script>
<script>
"use strict";
/* ---------- 聯絡人／商機／活動 ---------- */
function subForm(kind) {
  if (kind === "contacts") return `
    <h3>${esc(t("addContact"))}</h3>
    <div class="formrow">
      <div><label class="muted">${esc(t("cName"))}</label><input id="n_name" type="text"></div>
      <div><label class="muted">${esc(t("cRole"))}</label><input id="n_role" type="text"></div>
      <div><label class="muted">${esc(t("cEmail"))}</label><input id="n_email" type="email"></div>
      <div><label class="muted">${esc(t("cPhone"))}</label><input id="n_phone" type="text"></div>
      <div class="full"><label class="muted">${esc(t("cSource"))}</label><input id="n_source_url" type="url" placeholder="https://"></div>
    </div>
    <button class="btn" type="button" data-add="contacts">${esc(t("cAdd"))}</button>`;
  if (kind === "deals") return `
    <h3>${esc(t("addDeal"))}</h3>
    <div class="formrow">
      <div class="full"><label class="muted">${esc(t("dTitle"))}</label><input id="n_title" type="text"></div>
      <div><label class="muted">${esc(t("dStage"))}</label><select id="n_stage">${DEAL_STAGES.map(s => `<option>${esc(stageLabel(s))}</option>`).join("")}</select></div>
      <div><label class="muted">${esc(t("dAmount"))}</label><input id="n_amount" type="number" min="0" step="0.01"></div>
      <div><label class="muted">${esc(t("dClose"))}</label><input id="n_expected_close" type="date"></div>
      <div class="full"><label class="muted">${esc(t("dNotes"))}</label><textarea id="n_notes" rows="2"></textarea></div>
    </div>
    <button class="btn" type="button" data-add="deals">${esc(t("dAdd"))}</button>`;
  return `
    <h3>${esc(t("addActivity"))}</h3>
    <div class="formrow">
      <div><label class="muted">${esc(t("aType"))}</label><select id="n_type">${ACT_TYPES.map(s => `<option>${esc(s)}</option>`).join("")}</select></div>
      <div><label class="muted">${esc(t("aDue"))}</label><input id="n_due_date" type="date"></div>
      <div class="full"><label class="muted">${esc(t("aContent"))}</label><textarea id="n_content" rows="2"></textarea></div>
      <div><label><input id="n_done" type="checkbox" style="width:auto"> ${esc(t("aDone"))}</label></div>
    </div>
    <button class="btn" type="button" data-add="activities">${esc(t("aAdd"))}</button>`;
}
function subItem(kind, r) {
  const del = `<button class="btn ghost small" type="button" data-del="${kind}" data-id="${esc(r.id)}">${esc(t("del"))}</button>`;
  if (kind === "contacts") return `<div class="subitem"><b>${esc(r.name || t("untitled"))}</b> ${r.role ? "· " + esc(r.role) : ""}<br>
    <span class="meta">${esc([r.email, r.phone].filter(Boolean).join(" / ") || t("noPhone"))}${r.source_url ? ` · <a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(t("cSource"))}</a>` : ""}</span>
    <div style="margin-top:6px">${del}</div></div>`;
  if (kind === "deals") return `<div class="subitem"><b>${esc(r.title || t("untitled"))}</b> · ${esc(stageLabel(r.stage || ""))}${r.amount != null ? " · $" + Number(r.amount).toLocaleString() : ""}${r.expected_close ? " · " + esc(r.expected_close) : ""}<br>
    <span class="meta">${esc(r.notes || "")}</span>
    <div style="margin-top:6px">${del}</div></div>`;
  return `<div class="subitem"><b>${esc(r.type || "")}</b>${r.done ? " ✓" : ""}${r.due_date ? " · " + esc(r.due_date) : ""}<br>
    <span>${esc(r.content || "")}</span>
    <div style="margin-top:6px">${del}</div></div>`;
}
async function loadSubtab(kind) {
  const box = $("#tab-" + kind);
  box.innerHTML = `<p class="muted">${esc(t("loading"))}</p>`;
  try {
    const table = kind === "contacts" ? "crm_contacts" : kind === "deals" ? "crm_deals" : "crm_activities";
    const rows = await api.list(table, current.id);
    let html = subForm(kind) + `<p class="err" id="subErr"></p>`;
    html += rows.length ? rows.map(r => subItem(kind, r)).join("") : `<p class="muted">${esc(t("none"))}</p>`;
    box.innerHTML = html;
    box.querySelector("[data-add]").addEventListener("click", () => addSub(kind, table));
    box.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => delSub(kind, table, b.dataset.id)));
  } catch (e) {
    box.innerHTML = `<p class="err">${esc(t("loadFail"))}${esc(e.message)}</p>`;
  }
}
async function addSub(kind, table) {
  const err = $("#subErr");
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  let body = { company_id: current.id };
  if (kind === "contacts") {
    body = { ...body, name: val("n_name") || null, role: val("n_role") || null, email: val("n_email") || null, phone: val("n_phone") || null, source_url: val("n_source_url") || null };
    if (!body.name && !body.email) { err.textContent = t("cName") + " / " + t("cEmail"); return; }
  } else if (kind === "deals") {
    const stageSel = document.getElementById("n_stage");
    const stageVal = DEAL_STAGES[stageSel.selectedIndex] || "初步接觸";
    body = { ...body, title: val("n_title") || null, stage: stageVal, amount: val("n_amount") ? Number(val("n_amount")) : null, expected_close: val("n_expected_close") || null, notes: val("n_notes") || null };
    if (!body.title) { err.textContent = t("dTitle"); return; }
  } else {
    const typeSel = document.getElementById("n_type");
    body = { ...body, type: ACT_TYPES[typeSel.selectedIndex] || "備註", content: val("n_content") || null, due_date: val("n_due_date") || null, done: !!document.getElementById("n_done").checked, created_by: session && session.user ? session.user.id : null };
  }
  try {
    await api.add(table, body);
    loadSubtab(kind);
  } catch (e) {
    err.textContent = t("addFail") + e.message;
  }
}
async function delSub(kind, table, id) {
  if (!confirm(t("delConfirm"))) return;
  try {
    await api.del(table, id);
    loadSubtab(kind);
  } catch (e) {
    const err = $("#subErr");
    if (err) err.textContent = t("delFail") + e.message;
    else alert(t("delFail") + e.message);
  }
}

/* ---------- 名單池 ---------- */

$("#viewCompaniesBtn").addEventListener("click", () => showMainTab("companies"));
$("#viewLeadsBtn").addEventListener("click", () => showMainTab("leads"));

function filteredLeads() {
  const q = $("#lq").value.trim().toLowerCase();

    (!q || (l.brand || "").toLowerCase().includes(q)) &&
    (!band || (l.revenue_band || "").indexOf(band) === 0) &&

    (!st || l.status === st));

function renderLeadsStats() {

    `<div class="stat"><b>${leads.length}</b><span>${esc(t("leadStatTotal"))}</span></div>` +

    `<div class="stat"><b>${n(l => (l.revenue_band || "").indexOf("A2") === 0)}</b><span>A2</span></div>` +
    `<div class="stat"><b>${n(l => l.status === "new")}</b><span>${esc(t("leadStatNew"))}</span></div>` +
    `<div class="stat"><b>${n(l => l.status === "promoted")}</b><span>${esc(t("leadStatPromoted"))}</span></div>`;

const LEAD_PAGE_SIZE = 50;
let leadPage = 1;

  const list = filteredLeads();

  const start = (leadPage - 1) * LEAD_PAGE_SIZE;

  list.slice(start, start + LEAD_PAGE_SIZE).forEach(l => {
    const d = document.createElement("div");
    d.className = "lrow";
    const busy = leadBusy === l.id;
    const done = l.status === "promoted" || l.status === "rejected";
    d.innerHTML =
      `<span><span class="nm">${esc(l.brand || t("untitled"))}</span>${l.domain ? `<br><span class="dm">${domainLink(l.domain)}</span>` : ""}</span>` +
      `<span class="num" data-l="${esc(t("colRevenue"))}">${esc(fmtMoney(l.monthly_revenue))}</span>` +
      `<span class="num" data-l="${esc(t("colSales"))}">${esc(fmtInt(l.monthly_sales))}</span>` +
      `<span data-l="${esc(t("colBand"))}"><span class="tag b">${esc(bandShort(l.revenue_band))}</span></span>` +
      `<span data-l="${esc(t("colTier"))}">${esc(l.tier == null ? "—" : l.tier)}</span>` +
      `<span data-l="${esc(t("colStatus"))}"><span class="tag ${leadStatusTag(l.status)}">${esc(leadStatusLabel(l.status))}</span></span>` +
      `<span class="acts">` +
        `<button type="button" class="btn small" data-promote="${esc(l.id)}" ${done || busy ? "disabled" : ""}>${esc(t("leadPromote"))}</button>` +
        `<button type="button" class="btn ghost small" data-reject="${esc(l.id)}" ${done || busy ? "disabled" : ""}>${esc(t("leadReject"))}</button>` +
      `</span>`;

  source_id: ["來源編號", "Source ID"], monthly_sales: ["月銷量", "Monthly sales"],

  tier: ["級別", "Tier"], status: ["狀態", "Status"], dedupe_status: ["去重狀態", "Dedupe status"],

};
function leadFieldVal(l, f) {

  if (f === "revenue_band") return ["", ...LEAD_BANDS];

    } else if (type === "number") {

    } else if (type === "date") {

async function saveLeadEdit() {
  const l = currentLead;
  if (!l) return;
  const msg = $("#ldMsg");
  const body = {};
  for (const [f, type] of LEAD_EDIT_FIELDS) {
    const el = document.getElementById("le_" + f);
    if (!el) continue;
    let v = el.value.trim();
    if (v === "") { body[f] = null; continue; }
    if (type === "number") {
      const n = Number(v);
      if (!Number.isFinite(n) || n < 0) { msg.textContent = t("leadNumFail"); msg.className = "err"; return; }
      body[f] = n;
    } else if (f === "tier") {
      body[f] = Number(v);

      body[f] = v;
    }
  }
  if (!body.brand) { msg.textContent = t("leadBrandRequired"); msg.className = "err"; return; }
  msg.textContent = "";
  try {
    await api.patchLead(l.id, body);
    Object.assign(l, body);
    exitLeadEdit();
    openLeadDetail(l);
    renderLeadsStats(); renderLeads();
    const m = $("#ldMsg");
    m.textContent = t("leadSaved");
    m.className = "ok";
  } catch (e) {
    msg.textContent = t("leadSaveFail") + e.message;
    msg.className = "err";
  }
}

/* ---------- 名單匯入（貼文字） ---------- */
let importParsed = [];
const normBrand = s => (s || "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").replace(/\b(llc|inc|corp|co|ltd|the|company)\b/g, " ").replace(/\s+/g, " ").trim();
function importSlug(norm) {
  const s = norm.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  return s || "unnamed";
}
function parseImportLine(line) {
  let s = line.trim();
  if (!s) return null;
  let domain = null;
  const urlM = s.match(/https?:\/\/([a-z0-9.-]+\.[a-z]{2,})/i);
  if (urlM) { domain = urlM[1].replace(/^www\./i, "").toLowerCase(); s = s.replace(/https?:\/\/\S+/i, " ").trim(); }
  if (!domain) {
    const tokM = s.match(/(?:^|[\s,;|])((?:www\.)?[a-z0-9-]+\.[a-z]{2,}(?:\.[a-z]{2,})?)\s*$/i);
    if (tokM) { domain = tokM[1].replace(/^www\./i, "").toLowerCase(); s = s.slice(0, tokM.index).trim().replace(/[\s,;|]+$/, ""); }
  }
  if (!domain && s.includes(",")) {
    const parts = s.split(",");
    const last = parts[parts.length - 1].trim();
    if (/^[a-z0-9-]+\.[a-z]{2,}$/i.test(last)) { domain = last.toLowerCase(); s = parts.slice(0, -1).join(",").trim(); }
  }
  const brand = s.replace(/^["']|["']$/g, "").trim();
  if (!brand) return null;
  return { brand, domain };
}
function importDedupe(p) {
  const norm = normBrand(p.brand);
  const dom = (p.domain || "").toLowerCase();
  if ((dom && companies.some(c => (c.domain || "").toLowerCase() === dom)) || (norm && companies.some(c => normBrand(c.name) === norm)))
    return { status: "dup", where: t("importWhereCompanies") };
  if ((dom && leads.some(l => (l.domain || "").toLowerCase() === dom)) || (norm && leads.some(l => normBrand(l.brand) === norm)))
    return { status: "dup", where: t("importWhereLeads") };
  const similar = [...companies, ...leads].find(x => {
    const n2 = normBrand(x.name || x.brand);
    return norm.length >= 4 && n2.length >= 4 && norm !== n2 && (n2.includes(norm) || norm.includes(n2));
  });
  if (similar) return { status: "review", where: "" };
  return { status: "new", where: "" };
}
function renderImportPreview() {
  const el = $("#importPreview");
  if (!importParsed.length) { el.innerHTML = ""; return; }
  const domLabel = LEAD_FIELD_LABEL.domain[lang === "en" ? 1 : 0];
  el.innerHTML = `<div class="imp head"><span>${esc(t("colBrand"))}</span><span>${esc(domLabel)}</span><span>${esc(t("colStatus"))}</span><span>${esc(t("colNote"))}</span></div>` +
    importParsed.map(r => {
      const tag = r.status === "new" ? "green" : r.status === "dup" ? "grey" : "b";
      const label = t(r.status === "new" ? "importStNew" : r.status === "dup" ? "importStDup" : "importStReview");
      const note = r.status === "dup" ? t("importDupReason").replace("{where}", r.where) : r.status === "review" ? t("importReviewReason") : "";
      return `<div class="imp"><span><span class="nm">${esc(r.brand)}</span></span><span>${r.domain ? domainLink(r.domain) : "—"}</span><span><span class="tag ${tag}">${esc(label)}</span></span><span class="muted">${esc(note)}</span></div>`;
    }).join("");
}
$("#importToggleBtn").addEventListener("click", () => $("#importPanel").classList.toggle("hidden"));
$("#importParseBtn").addEventListener("click", () => {
  const msg = $("#importMsg");
  const src = $("#importSource").value.trim();
  if (!src) { msg.textContent = t("importNeedSource"); msg.className = "err"; return; }
  const text = $("#importText").value;
  if (!text.trim()) { msg.textContent = t("importNeedText"); msg.className = "err"; return; }
  const rows = [];
  const seen = new Set();
  text.split(/\n/).forEach(line => {
    const p = parseImportLine(line);
    if (!p) return;
    const key = normBrand(p.brand) + "|" + (p.domain || "");
    if (seen.has(key)) return;
    seen.add(key);
    rows.push({ ...p, ...importDedupe(p) });
  });
  importParsed = rows;
  renderImportPreview();
  const n = rows.length, a = rows.filter(r => r.status === "new").length,
    d = rows.filter(r => r.status === "dup").length, r = rows.filter(r => r.status === "review").length;
  msg.textContent = t("importParsed").replace("{n}", n).replace("{a}", a).replace("{d}", d).replace("{r}", r);
  msg.className = "ok";
  $("#importBtn").classList.toggle("hidden", a === 0);
});
$("#importBtn").addEventListener("click", async () => {
  const msg = $("#importMsg");
  const src = $("#importSource").value.trim();
  const news = importParsed.filter(r => r.status === "new");
  if (!news.length || !src) return;
  const btn = $("#importBtn");
  btn.disabled = true;
  const usedIds = new Set(leads.map(l => l.id));
  const body = news.map(r => {
    let base = "imp-" + importSlug(normBrand(r.brand));
    let id = base, n = 2;
    while (usedIds.has(id)) { id = base + "-" + n; n++; }
    usedIds.add(id);
    return { id, brand: r.brand, domain: r.domain || null, source: src, source_id: null, date_sc: null, monthly_sales: null, monthly_revenue: null, revenue_band: null, tier: null, dedupe_status: "new", matched_company_id: null, status: "new" };
  });
  try {
    const rows = await api.addLeadsBulk(body);
    const added = Array.isArray(rows) ? rows : body;
    added.forEach(r => leads.push(r));
    importParsed = [];
    renderImportPreview();
    renderLeadsStats(); renderLeads();
    msg.textContent = t("importDone").replace("{n}", added.length);
    msg.className = "ok";
    btn.classList.add("hidden");
    $("#importText").value = "";
  } catch (e) {
    msg.textContent = t("importFail") + e.message;
    msg.className = "err";
  } finally {
    btn.disabled = false;
  }
});

function setLeadsMsg(text, kind) {
  const el = $("#leadsMsg");
  el.textContent = text;
  el.className = kind === "ok" ? "ok" : kind === "muted" ? "muted" : "err";
}
async function loadLeads() {

    leads = await api.leads();
    leadsLoaded = true;
    leadPage = 1;
    setLeadsMsg("", "muted");
    renderLeadsStats(); renderLeads();
  } catch (e) {
    setLeadsMsg(t("loadFail") + e.message, "err");
  }
}
async function promoteLead(lead) {
  /* crm_companies.domain 為 NOT NULL UNIQUE：沒有網域的名單無法晉升，擋下並明說，不亂填佔位值 */
  if (!lead.domain) { setLeadsMsg(t("leadNoDomain"), "err"); return; }
  if (!confirm(t("leadPromoteConfirm").replace("{b}", lead.brand))) return;
  leadBusy = lead.id;
  renderLeads();
  try {
    const body = { id: lead.id, name: lead.brand, domain: lead.domain, market: "未查核", factory: "未知", stage: "研究中", priority: "B", source: lead.source };
    const created = await api.addCompany(body);
    const row = Array.isArray(created) ? created[0] : created;
    if (row) { companies.push(row); renderStats(); renderList(); }
    try {
      await api.patchLead(lead.id, { status: "promoted", matched_company_id: lead.id });
    } catch (e2) {
      /* 品牌已建立、名單狀態未更新：不把本地狀態寫成已晉升（以 DB 為準），請使用者在 Supabase 手動補狀態 */
      setLeadsMsg(t("leadPromotedPartial") + e2.message, "err");
      return;
    }
    lead.status = "promoted"; lead.matched_company_id = lead.id;
    renderLeadsStats(); renderLeads();
    setLeadsMsg(t("leadPromoted"), "ok");
  } catch (e) {
    setLeadsMsg(t("leadActionFail") + e.message, "err");
  } finally {
    leadBusy = null;
    renderLeads();
  }
}
async function rejectLead(lead) {
  if (!confirm(t("leadRejectConfirm").replace("{b}", lead.brand))) return;
  leadBusy = lead.id;
  renderLeads();
  try {
    await api.patchLead(lead.id, { status: "rejected" });
    lead.status = "rejected";
    renderLeadsStats(); renderLeads();
    setLeadsMsg(t("leadRejected"), "ok");
  } catch (e) {
    setLeadsMsg(t("leadActionFail") + e.message, "err");
  } finally {
    leadBusy = null;
    renderLeads();
  }
}
["lq","fBand","fTier","fStatus"].forEach(id => {
  $("#" + id).addEventListener("input", () => { leadPage = 1; renderLeads(); });
  $("#" + id).addEventListener("change", () => { leadPage = 1; renderLeads(); });
