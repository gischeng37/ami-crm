<!DOCTYPE html>
<html lang="zh-Hant">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1c2530; --muted:#667085; --line:#dfe4ea;
  --accent:#0b6fa4; --accent-ink:#fff; --danger:#b42318; --ok:#067647;
  --chip:#eef4f8; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.topbar h1{font-size:18px;margin:0;white-space:nowrap}
.topbar .spacer{flex:1}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--danger);font-size:13px;min-height:1.2em}
.ok{color:var(--ok);font-size:13px}
.hidden{display:none!important}
/* login */
.login{max-width:420px;margin:48px auto}
.login label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.login h2{margin:0 0 4px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--chip);border-radius:8px;padding:10px 12px}
.stat b{font-size:22px;display:block}
.stat span{font-size:13px;color:var(--muted)}
/* filters */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.filters label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
/* list */
.row{display:grid;grid-template-columns:2.2fr 1fr .8fr 1fr 1.2fr;gap:10px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f7fafc}
.row.head{font-size:12px;color:var(--muted);cursor:default;background:none;font-weight:700}
.row .nm{font-weight:700}
.row .dm{color:var(--muted);font-size:13px;word-break:break-all}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
.tag.a{background:#fdecec;color:#b42318;font-weight:700}
.tag.b{background:#eef4f8;color:#0b6fa4;font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* detail overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;justify-content:flex-end}
.panel{background:#fff;width:min(680px,100%);height:100%;overflow-y:auto;padding:18px}
.panel h2{margin:0 0 2px;word-break:break-all}
.panel h3{margin:18px 0 8px;font-size:15px;border-bottom:1px solid var(--line);padding-bottom:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.kv dd a{word-break:break-all}
.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.editgrid .full{grid-column:1/-1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.subitem{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;font-size:14px}
.subitem .meta{color:var(--muted);font-size:12px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.formrow .full{grid-column:1/-1}
@media (max-width:768px){
  .filters{grid-template-columns:1fr 1fr}
  .filters .full-m{grid-column:1/-1}
  .row{grid-template-columns:1fr 1fr;row-gap:4px}
  .row.head{display:none}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:6px}
  .editgrid,.formrow{grid-template-columns:1fr}
  body{font-size:14px}
}
@media (max-width:480px){
  .wrap{padding:10px}
  .topbar h1{font-size:16px}
  .filters{grid-template-columns:1fr}
  .panel{padding:14px}
  .stat b{font-size:19px}
}
</style>
</head>

let tab = "info";

const $ = s => document.querySelector(s);
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.zh[k] || k;
const fl = f => (FIELD_LABEL[f] ? FIELD_LABEL[f][lang === "en" ? 1 : 0] : f);
const stageLabel = s => (STAGE_LABEL[s] ? STAGE_LABEL[s][lang === "en" ? 1 : 0] : s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isUrl = s => typeof s === "string" && /^https?:\/\//i.test(s.trim());

/* ---------- API ---------- */
function headers(json) {
  const h = { "apikey": SB_ANON };
  if (session && session.access_token) h["Authorization"] = "Bearer " + session.access_token;
  if (json) h["Content-Type"] = "application/json";
  if (json) h["Prefer"] = "return=representation";
  return h;
}
async function sb(path, opts) {
  const res = await fetch(SB_URL + path, opts || {});
  if (res.status === 401) { signOut(true); throw new Error(t("needLogin")); }
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); if (j.message) msg = j.message; else if (j.error_description) msg = j.error_description; } catch(e) {}
    throw new Error(msg);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const api = {
  companies: () => sb("/rest/v1/crm_companies?select=*&order=name.asc&limit=1000", { headers: headers() }),
  patchCompany: (id, body) => sb("/rest/v1/crm_companies?id=eq." + encodeURIComponent(id), { method: "PATCH", headers: headers(true), body: JSON.stringify(body) }),
  list: (table, companyId) => sb("/rest/v1/" + table + "?company_id=eq." + encodeURIComponent(companyId) + "&select=*&order=created_at.desc&limit=200", { headers: headers() }),
  add: (table, body) => sb("/rest/v1/" + table, { method: "POST", headers: headers(true), body: JSON.stringify(body) }),
  del: (table, id) => sb("/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), { method: "DELETE", headers: headers(true) })
};

/* ---------- 語言 ---------- */
function applyLang() {
  document.documentElement.lang = lang === "en" ? "en" : "zh-Hant";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $("#langBtn").textContent = lang === "en" ? "中文" : "EN";
  renderStats(); renderList(); renderFilterOptions();
  if (current) renderDetail(current, true);
}
$("#langBtn").addEventListener("click", () => {
  lang = lang === "en" ? "zh" : "en";
  localStorage.setItem("crm_lang", lang);
  applyLang();
});

/* ---------- 登入 ---------- */
function showLogin() {
  $("#loginView").classList.remove("hidden");
  $("#mainView").classList.add("hidden");
  $("#logoutBtn").classList.add("hidden");
  $("#whoami").textContent = "";
}
function showMain() {
  $("#loginView").classList.add("hidden");
  $("#mainView").classList.remove("hidden");
  $("#logoutBtn").classList.remove("hidden");
  $("#whoami").textContent = (session && session.user && session.user.email) || "";
}
function signOut(silent) {
  session = null;
  localStorage.removeItem("crm_session");
  companies = []; current = null;
  closeDetail();
  showLogin();
  if (!silent) $("#msg").textContent = "";
}
$("#logoutBtn").addEventListener("click", () => signOut(false));
$("#loginBtn").addEventListener("click", async () => {
  const email = $("#email").value.trim(), password = $("#password").value;
  $("#loginErr").textContent = "";
  $("#loginBtn").disabled = true;
  try {
    const res = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "apikey": SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error_description || j.msg || j.message || res.statusText);
    session = { access_token: j.access_token, refresh_token: j.refresh_token, user: j.user };
    localStorage.setItem("crm_session", JSON.stringify(session));
    $("#password").value = "";
    showMain();
    await loadCompanies();
  } catch (e) {
    $("#loginErr").textContent = t("loginFail") + " (" + e.message + ")";
  } finally {
    $("#loginBtn").disabled = false;
  }
});
$("#password").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });

/* ---------- 重設密碼（recovery 連結） ---------- */
function parseHashParams() {
  const h = location.hash || "";
  if (!h.startsWith("#")) return new URLSearchParams();
  return new URLSearchParams(h.slice(1));
}
async function handleRecoveryHash() {
  const p = parseHashParams();
  if (p.get("type") !== "recovery" || !p.get("access_token")) return false;
  const access = p.get("access_token"), refresh = p.get("refresh_token") || "";
  try {
    const res = await fetch(SB_URL + "/auth/v1/user", {
      headers: { "apikey": SB_ANON, "Authorization": "Bearer " + access }
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error_description || j.msg || j.message || res.statusText);
    session = { access_token: access, refresh_token: refresh, user: j };
    localStorage.setItem("crm_session", JSON.stringify(session));
    history.replaceState(null, "", location.pathname + location.search);
    $("#loginView").classList.add("hidden");
    $("#mainView").classList.add("hidden");
    $("#logoutBtn").classList.add("hidden");
    $("#resetView").classList.remove("hidden");
    return true;
  } catch (e) {
    history.replaceState(null, "", location.pathname + location.search);
    showLogin();
    $("#loginErr").textContent = t("resetExpired") + " (" + e.message + ")";
    return true;
  }
}
$("#setPwBtn").addEventListener("click", async () => {
  const pw1 = $("#newPw").value, pw2 = $("#newPw2").value;
  $("#resetErr").textContent = "";
  $("#resetOk").textContent = "";
  if (pw1.length < 6) { $("#resetErr").textContent = t("resetShort"); return; }
  if (pw1 !== pw2) { $("#resetErr").textContent = t("resetMismatch"); return; }
  $("#setPwBtn").disabled = true;
  try {
    const res = await fetch(SB_URL + "/auth/v1/user", {
      method: "PUT",
      headers: { "apikey": SB_ANON, "Authorization": "Bearer " + session.access_token, "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw1 })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error_description || j.msg || j.message || res.statusText);
    const em = (session && session.user && session.user.email) || "";
    $("#resetOk").textContent = t("resetSuccess");
    $("#newPw").value = "";
    $("#newPw2").value = "";
    setTimeout(() => {
      $("#resetView").classList.add("hidden");
      signOut(true);
      $("#email").value = em;
    }, 1200);
  } catch (e) {
    $("#resetErr").textContent = t("resetFail") + e.message;
  } finally {
    $("#setPwBtn").disabled = false;
  }
});
$("#forgotLink").addEventListener("click", async e => {
  e.preventDefault();
  const email = $("#email").value.trim();
  $("#forgotMsg").textContent = "";
  $("#loginErr").textContent = "";
  if (!email) { $("#loginErr").textContent = t("forgotNeedEmail"); return; }
  try {
    const res = await fetch(SB_URL + "/auth/v1/recover", {
      method: "POST",
      headers: { "apikey": SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error_description || j.msg || j.message || res.statusText);
    $("#forgotMsg").textContent = t("forgotSent");
  } catch (err) {
    $("#loginErr").textContent = t("forgotFail") + err.message;
  }
});
</script>
<script>
"use strict";
/* ---------- 清單 ---------- */
function renderFilterOptions() {
  const fill = (sel, values) => {
    const el = $(sel), cur = el.value;
    const keep = el.querySelector("option[value='']");
    el.innerHTML = "";
    el.appendChild(keep);
    values.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = (sel === "#fStage" ? stageLabel(v) : v); el.appendChild(o); });
    el.value = cur;
  };
  const uniq = f => [...new Set(companies.map(c => c[f]).filter(Boolean))].sort();
  fill("#fStage", STAGES.filter(s => companies.some(c => c.stage === s)));
  fill("#fFactory", uniq("factory"));
  fill("#fFormat", uniq("format"));
  const es = $("#eStage");
  if (es && !es.options.length) STAGES.forEach(s => { const o = document.createElement("option"); o.value = s; o.textContent = stageLabel(s); es.appendChild(o); });
  if (es) [...es.options].forEach(o => { o.textContent = stageLabel(o.value); });
}
function filtered() {
  const q = $("#q").value.trim().toLowerCase();
  const p = $("#fPriority").value, s = $("#fStage").value, fa = $("#fFactory").value, fo = $("#fFormat").value;
  return companies.filter(c =>
    (!q || (c.name || "").toLowerCase().includes(q) || (c.domain || "").toLowerCase().includes(q)) &&
    (!p || c.priority === p) && (!s || c.stage === s) && (!fa || c.factory === fa) && (!fo || c.format === fo));
}
function renderStats() {
  const el = $("#stats");
  if (!companies.length) { el.innerHTML = ""; return; }
  const count = f => companies.filter(c => c[f] === f).length;
  const byPri = ["A","B","C"].map(p => ({ k: p, n: companies.filter(c => c.priority === p).length }));
  const byStage = {};
  companies.forEach(c => { byStage[c.stage || "—"] = (byStage[c.stage || "—"] || 0) + 1; });
  let html = `<div class="stat"><b>${companies.length}</b><span>${esc(t("statTotal"))}</span></div>`;
  byPri.forEach(x => { html += `<div class="stat"><b>${x.n}</b><span>${esc(t("priority"))} ${esc(x.k)}</span></div>`; });
  Object.keys(byStage).sort().forEach(s => { html += `<div class="stat"><b>${byStage[s]}</b><span>${esc(t("statStage").replace("{s}", stageLabel(s)))}</span></div>`; });
  el.innerHTML = html;
}
function renderList() {
  const list = filtered();
  $("#listMeta").textContent = t("showing").replace("{n}", companies.length).replace("{m}", list.length);
  const box = $("#list");
  box.innerHTML = "";
  $("#listEmpty").classList.toggle("hidden", list.length > 0);
  list.slice(0, 200).forEach(c => {
    const d = document.createElement("div");
    d.className = "row";
    d.innerHTML =
      `<span><span class="nm">${esc(c.name || t("untitled"))}</span><br><span class="dm">${esc(c.domain || "")}</span></span>` +
      `<span><span class="tag ${c.priority === "A" ? "a" : "b"}">${esc(c.priority || "")}</span></span>` +
      `<span>${esc(stageLabel(c.stage || ""))}</span>` +
      `<span>${esc(c.factory || "")}</span>` +
      `<span class="dm">${esc(c.contact || "")}</span>`;
    d.addEventListener("click", () => openDetail(c));
    box.appendChild(d);
  });
  if (list.length > 200) {
    const more = document.createElement("div");
    more.className = "empty";
    more.textContent = "… +" + (list.length - 200);
    box.appendChild(more);
  }
}
async function loadCompanies() {
  $("#msg").textContent = t("loading");
  try {
    companies = await api.companies();
    $("#msg").textContent = "";
    renderFilterOptions(); renderStats(); renderList();
  } catch (e) {
    $("#msg").textContent = t("loadFail") + e.message;
  }
}
["q","fPriority","fStage","fFactory","fFormat"].forEach(id => {
  $("#" + id).addEventListener("input", renderList);
  $("#" + id).addEventListener("change", renderList);
});
$("#resetBtn").addEventListener("click", () => {
  $("#q").value = ""; $("#fPriority").value = ""; $("#fStage").value = ""; $("#fFactory").value = ""; $("#fFormat").value = "";
  renderList();
});

/* ---------- 明細 ---------- */
function fieldVal(c, f) {
  const v = c[f];
  if (v == null || v === "") return "—";
  if (isUrl(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`;
  return esc(v);
}
function renderDetail(c, keepTab) {
  current = c;
  $("#dName").textContent = c.name || t("untitled");
  $("#dDomain").textContent = c.domain || "";
  $("#dTags").innerHTML =
    `<span class="tag ${c.priority === "A" ? "a" : "b"}">${esc(c.priority || "")}</span> ` +
    `<span class="tag">${esc(stageLabel(c.stage || ""))}</span> ` +
    `<span class="tag">${esc(c.factory || "")}</span> ` +
    `<span class="tag">${esc(c.format || "")}</span>`;
  $("#eStage").value = c.stage || "研究中";
  $("#eOwner").value = c.owner || "";
  $("#eNextDate").value = c.next_date || "";
  $("#eNextAction").value = c.next_action || "";
  $("#saveMsg").textContent = "";
  let html = "";
  FIELD_GROUPS.forEach(([g, fields]) => {
    html += `<h3>${esc(t(g))}</h3><dl class="kv">`;
    fields.forEach(f => { html += `<dt>${esc(fl(f))}</dt><dd>${fieldVal(c, f)}</dd>`; });
    html += `</dl>`;
  });
  $("#tab-info").innerHTML = html;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ["info","contacts","deals","activities"].forEach(x => $("#tab-" + x).classList.toggle("hidden", x !== tab));
  if (tab !== "info") loadSubtab(tab);
}
function openDetail(c) {
  tab = "info";
  renderDetail(c);
  $("#overlay").classList.remove("hidden");
  document.body.style.overflow = "hidden";
}
function closeDetail() {
  $("#overlay").classList.add("hidden");
  document.body.style.overflow = "";
  current = null;
}
$("#closeBtn").addEventListener("click", closeDetail);
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeDetail(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  if (current) renderDetail(current, true);
}));
$("#saveBtn").addEventListener("click", async () => {
  if (!current) return;
  $("#saveBtn").disabled = true;
  $("#saveMsg").textContent = "";
  const body = {
    stage: $("#eStage").value,
    owner: $("#eOwner").value.trim() || null,
    next_date: $("#eNextDate").value || null,
    next_action: $("#eNextAction").value.trim() || null
  };
  try {
    const updated = await api.patchCompany(current.id, body);
    const row = Array.isArray(updated) ? updated[0] : updated;
    if (row) {
      const i = companies.findIndex(x => x.id === current.id);
      if (i >= 0) companies[i] = row;
      current = row;
    } else {
      Object.assign(current, body);
    }
    $("#saveMsg").textContent = t("saved");
    renderStats(); renderList(); renderDetail(current, true);
  } catch (e) {
    $("#saveMsg").textContent = t("saveFail") + e.message;
    $("#saveMsg").className = "err";
    setTimeout(() => { $("#saveMsg").className = "ok"; }, 4000);
  } finally {
    $("#saveBtn").disabled = false;
  }
});
</script>
<script>
"use strict";
/* ---------- 聯絡人／商機／活動 ---------- */
function subForm(kind) {
  if (kind === "contacts") return `
    <h3>${esc(t("addContact"))}</h3>
    <div class="formrow">
      <div><label class="muted">${esc(t("cName"))}</label><input id="n_name" type="text"></div>
      <div><label class="muted">${esc(t("cRole"))}</label><input id="n_role" type="text"></div>
      <div><label class="muted">${esc(t("cEmail"))}</label><input id="n_email" type="email"></div>
      <div><label class="muted">${esc(t("cPhone"))}</label><input id="n_phone" type="text"></div>
      <div class="full"><label class="muted">${esc(t("cSource"))}</label><input id="n_source_url" type="url" placeholder="https://"></div>
    </div>
    <button class="btn" type="button" data-add="contacts">${esc(t("cAdd"))}</button>`;
  if (kind === "deals") return `
    <h3>${esc(t("addDeal"))}</h3>
    <div class="formrow">
      <div class="full"><label class="muted">${esc(t("dTitle"))}</label><input id="n_title" type="text"></div>
      <div><label class="muted">${esc(t("dStage"))}</label><select id="n_stage">${DEAL_STAGES.map(s => `<option>${esc(stageLabel(s))}</option>`).join("")}</select></div>
      <div><label class="muted">${esc(t("dAmount"))}</label><input id="n_amount" type="number" min="0" step="0.01"></div>
      <div><label class="muted">${esc(t("dClose"))}</label><input id="n_expected_close" type="date"></div>
      <div class="full"><label class="muted">${esc(t("dNotes"))}</label><textarea id="n_notes" rows="2"></textarea></div>
    </div>
    <button class="btn" type="button" data-add="deals">${esc(t("dAdd"))}</button>`;
  return `
    <h3>${esc(t("addActivity"))}</h3>
    <div class="formrow">
      <div><label class="muted">${esc(t("aType"))}</label><select id="n_type">${ACT_TYPES.map(s => `<option>${esc(s)}</option>`).join("")}</select></div>
      <div><label class="muted">${esc(t("aDue"))}</label><input id="n_due_date" type="date"></div>
      <div class="full"><label class="muted">${esc(t("aContent"))}</label><textarea id="n_content" rows="2"></textarea></div>
      <div><label><input id="n_done" type="checkbox" style="width:auto"> ${esc(t("aDone"))}</label></div>
    </div>
    <button class="btn" type="button" data-add="activities">${esc(t("aAdd"))}</button>`;
}
function subItem(kind, r) {
  const del = `<button class="btn ghost small" type="button" data-del="${kind}" data-id="${esc(r.id)}">${esc(t("del"))}</button>`;
  if (kind === "contacts") return `<div class="subitem"><b>${esc(r.name || t("untitled"))}</b> ${r.role ? "· " + esc(r.role) : ""}<br>
    <span class="meta">${esc([r.email, r.phone].filter(Boolean).join(" / ") || t("noPhone"))}${r.source_url ? ` · <a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(t("cSource"))}</a>` : ""}</span>
    <div style="margin-top:6px">${del}</div></div>`;
  if (kind === "deals") return `<div class="subitem"><b>${esc(r.title || t("untitled"))}</b> · ${esc(stageLabel(r.stage || ""))}${r.amount != null ? " · $" + Number(r.amount).toLocaleString() : ""}${r.expected_close ? " · " + esc(r.expected_close) : ""}<br>
    <span class="meta">${esc(r.notes || "")}</span>
    <div style="margin-top:6px">${del}</div></div>`;
  return `<div class="subitem"><b>${esc(r.type || "")}</b>${r.done ? " ✓" : ""}${r.due_date ? " · " + esc(r.due_date) : ""}<br>
    <span>${esc(r.content || "")}</span>
    <div style="margin-top:6px">${del}</div></div>`;
}
async function loadSubtab(kind) {
  const box = $("#tab-" + kind);
  box.innerHTML = `<p class="muted">${esc(t("loading"))}</p>`;
  try {
    const table = kind === "contacts" ? "crm_contacts" : kind === "deals" ? "crm_deals" : "crm_activities";
    const rows = await api.list(table, current.id);
    let html = subForm(kind) + `<p class="err" id="subErr"></p>`;
    html += rows.length ? rows.map(r => subItem(kind, r)).join("") : `<p class="muted">${esc(t("none"))}</p>`;
    box.innerHTML = html;
    box.querySelector("[data-add]").addEventListener("click", () => addSub(kind, table));
    box.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => delSub(kind, table, b.dataset.id)));
  } catch (e) {
    box.innerHTML = `<p class="err">${esc(t("loadFail"))}${esc(e.message)}</p>`;
  }
}
async function addSub(kind, table) {
  const err = $("#subErr");
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  let body = { company_id: current.id };
  if (kind === "contacts") {
    body = { ...body, name: val("n_name") || null, role: val("n_role") || null, email: val("n_email") || null, phone: val("n_phone") || null, source_url: val("n_source_url") || null };
    if (!body.name && !body.email) { err.textContent = t("cName") + " / " + t("cEmail"); return; }
  } else if (kind === "deals") {
    const stageSel = document.getElementById("n_stage");
    const stageVal = DEAL_STAGES[stageSel.selectedIndex] || "初步接觸";
    body = { ...body, title: val("n_title") || null, stage: stageVal, amount: val("n_amount") ? Number(val("n_amount")) : null, expected_close: val("n_expected_close") || null, notes: val("n_notes") || null };
    if (!body.title) { err.textContent = t("dTitle"); return; }
  } else {
    const typeSel = document.getElementById("n_type");
    body = { ...body, type: ACT_TYPES[typeSel.selectedIndex] || "備註", content: val("n_content") || null, due_date: val("n_due_date") || null, done: !!document.getElementById("n_done").checked, created_by: session && session.user ? session.user.id : null };
  }
  try {
    await api.add(table, body);
    loadSubtab(kind);
  } catch (e) {
    err.textContent = t("addFail") + e.message;
  }
}
async function delSub(kind, table, id) {
  if (!confirm(t("delConfirm"))) return;
  try {
    await api.del(table, id);
    loadSubtab(kind);
  } catch (e) {
    const err = $("#subErr");
    if (err) err.textContent = t("delFail") + e.message;
    else alert(t("delFail") + e.message);
  }
}

/* ---------- 啟動 ---------- */
applyLang();
handleRecoveryHash().then(inRecovery => {
  if (inRecovery) return;
  if (session && session.access_token) {
    showMain();
    loadCompanies();
  } else {
    showLogin();
  }
});
</script>
</body>
